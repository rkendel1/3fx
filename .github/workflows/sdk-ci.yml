name: SDK CI

# Builds the native addon on each runner and proves the packed @appport/fx
# tarball installs and works from a clean consumer project. Deterministic: it
# uses an in-process fake provider and never needs a running model.
on:
  pull_request:
    paths:
      - "sdk/**"
      - "src/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/sdk-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packed-consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      # package-libfx.mjs builds the CommonJS entry with `bun build`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Build the native addon and wasm assets
        run: |
          NODE_INCLUDE="$(dirname "$(dirname "$(command -v node)")")/include/node"
          zig build -Dnapi-surface=core -Doptimize=ReleaseSafe "-Dnode-include-dir=$NODE_INCLUDE"
          zig build -Dwasm-surface=core
          zig build -Dwasm-surface=term

      - name: Direct model API tests
        run: node --expose-gc sdk/tests/test-native-model.mjs

      - name: Direct agent tests (no Vercel AI Gateway)
        run: |
          node sdk/tests/test-direct-agent.mjs
          node sdk/tests/test-direct-agent-provider.mjs

      - name: Packed tarball consumer smoke test
        run: node sdk/tests/test-packed-consumer.mjs
