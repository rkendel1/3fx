name: Release SDK

# Publishes sdk/package.json's version to npm when it is not there yet. Bump
# the version in sdk/package.json and merge to main to release; pushes that
# leave the version unchanged exit after the npm check.
on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "src/**"
      - "build.zig"
      - "build.zig.zon"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify everything, then run npm publish --dry-run"
        type: boolean
        default: true

concurrency:
  group: release-sdk
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Build, verify, and publish @appport/fx
        env:
          # An npm automation token (or granular token with 2FA bypass);
          # a token that requires a one-time password cannot publish from CI.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node sdk/scripts/release.mjs --provenance --dry-run
          else
            node sdk/scripts/release.mjs --provenance
          fi
